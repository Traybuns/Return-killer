<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask Alexa</title>
<style>
  :root {
    --bg:#070a0f; --panel:#0f141c; --panel-2:#151c27; --line:rgba(255,255,255,.1);
    --text:#f1f4f8; --muted:#8c98a8; --alexa:#00b0ff; --alexa-2:#0066ff; --accent:#ff9900;
    --good:#00e5a0; --warn:#ffb020; --bad:#ff5c6c;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.45; }
  .app { height:100%; max-width:820px; margin:0 auto; display:flex; flex-direction:column; padding:10px 12px 12px; gap:8px; }
  .embedded .app { max-width:none; padding:12px 18px 14px; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .top h1 { font-size:1rem; font-weight:700; display:flex; align-items:center; gap:8px; }
  .dot { width:10px; height:10px; border-radius:50%; background:linear-gradient(135deg,var(--alexa),var(--alexa-2)); box-shadow:0 0 12px var(--alexa); }
  .toggle { display:flex; align-items:center; gap:6px; font-size:.78rem; color:var(--muted); cursor:pointer; user-select:none; }
  #chat { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:4px 2px; scroll-behavior:smooth; }
  .msg { max-width:86%; padding:9px 13px; border-radius:16px; font-size:.93rem; white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.user { align-self:flex-end; background:var(--panel-2); border:1px solid var(--line); border-bottom-right-radius:5px; }
  .msg.alexa { align-self:flex-start; background:linear-gradient(135deg,rgba(0,176,255,.18),rgba(0,102,255,.18)); border:1px solid rgba(0,176,255,.35); border-bottom-left-radius:5px; }
  .msg img { display:block; max-width:220px; max-height:160px; border-radius:10px; }
  .msg.typing { color:var(--muted); font-style:italic; }
  .tools { display:flex; gap:8px; align-items:center; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; flex:1; }
  .chips::-webkit-scrollbar { display:none; }
  .chip, .pill { flex:none; background:var(--panel-2); border:1px solid var(--line); color:var(--text); border-radius:999px; padding:6px 12px; font-size:.78rem; cursor:pointer; font-family:inherit; white-space:nowrap; }
  .chip:hover, .pill:hover { border-color:var(--alexa); }
  .pill { display:inline-flex; align-items:center; gap:6px; background:transparent; border-color:rgba(255,153,0,.5); color:#ffc14d; }
  .pill:hover { border-color:var(--accent); }
  .pill svg { width:14px; height:14px; }
  .row { display:flex; gap:8px; }
  input[type=text] { flex:1; min-width:0; background:var(--panel-2); border:1px solid var(--line); border-radius:999px; color:var(--text); padding:11px 16px; font-size:.95rem; font-family:inherit; }
  input[type=text]:focus { outline:none; border-color:var(--alexa); }
  button.send, button.mic { border:none; border-radius:999px; padding:0 18px; font-weight:700; font-family:inherit; cursor:pointer; color:#fff; background:linear-gradient(135deg,var(--alexa),var(--alexa-2)); }
  button.mic { width:44px; padding:0; display:grid; place-items:center; flex:none; }
  button.mic.live { background:var(--bad); animation:pulse 1s infinite; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button:focus-visible, input:focus-visible, .chip:focus-visible { outline:2px solid var(--alexa); outline-offset:2px; }
  @keyframes pulse { 50% { opacity:.6; } }
  #debug { display:none; max-height:30vh; overflow:auto; font:.72rem ui-monospace,Menlo,monospace; color:var(--muted); border-top:1px solid var(--line); }
  body.debug #debug { display:block; }
  #debug details { padding:4px 0; border-top:1px solid var(--line); } #debug summary { cursor:pointer; color:var(--text); } #debug pre { white-space:pre-wrap; word-break:break-word; }
  @media (prefers-reduced-motion:reduce) { #chat { scroll-behavior:auto; } button.mic.live { animation:none; } }
</style>
</head>
<body>
<script>if (window.self !== window.top) document.documentElement.classList.add('embedded');</script>
<div class="app">
  <div class="top">
    <h1><span class="dot"></span>Ask Alexa</h1>
    <label class="toggle"><input type="checkbox" id="speak" checked> Voice replies</label>
  </div>
  <div id="chat" aria-live="polite"></div>
  <div class="tools">
    <button type="button" class="pill" id="scanBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Scan my space</button>
    <button type="button" class="pill" id="uploadBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Upload photo</button>
    <div class="chips" id="chips"></div>
  </div>
  <input type="file" id="fileScan" accept="image/*" capture="environment" hidden>
  <input type="file" id="fileUpload" accept="image/*" hidden>
  <form class="row" id="form">
    <button type="button" class="mic" id="mic" title="Speak" aria-label="Speak">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
    </button>
    <input type="text" id="input" placeholder="Ask about any product, like “will a Ninja air fryer fit under my cabinet?”" autocomplete="off" aria-label="Message">
    <button class="send" type="submit" id="send">Ask</button>
  </form>
  <div id="debug"></div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const chat = $('chat');
  const DEBUG = new URLSearchParams(location.search).has('debug');
  if (DEBUG) document.body.classList.add('debug');
  let rpcId = 0, products = [], lastAsin = null, lastTitle = '', pendingFit = false, initialized = false, scanCm = null;

  // ---- minimal MCP client (Streamable HTTP, stateless, JSON responses) ----
  async function rpc(method, params, notify) {
    const body = notify ? { jsonrpc: '2.0', method, params } : { jsonrpc: '2.0', id: ++rpcId, method, params };
    const res = await fetch('/mcp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json, text/event-stream' },
      body: JSON.stringify(body),
    });
    if (notify) return null;
    const text = await res.text();
    try { return JSON.parse(text); }
    catch { // tolerate an SSE-framed reply
      const line = text.split('\n').find(l => l.startsWith('data:'));
      return line ? JSON.parse(line.slice(5)) : { error: { message: 'Unreadable response (HTTP ' + res.status + ')' } };
    }
  }
  async function ensureInit() {
    if (initialized) return;
    await rpc('initialize', { protocolVersion: '2025-06-18', capabilities: {}, clientInfo: { name: 'alexa-plus-simulator', version: '0.2' } });
    await rpc('notifications/initialized', {}, true);
    initialized = true;
  }
  function logCall(name, args, response, ms) {
    if (!DEBUG) return;
    const d = document.createElement('details'), s = document.createElement('summary'), pre = document.createElement('pre');
    s.textContent = `${name}(${JSON.stringify(args || {})})  ${ms}ms`;
    pre.textContent = JSON.stringify(response, null, 2);
    d.append(s, pre);
    $('debug').prepend(d);
  }
  async function callTool(name, args = {}) {
    await ensureInit();
    const t0 = performance.now();
    const resp = await rpc('tools/call', { name, arguments: args });
    logCall(name, args, resp, Math.round(performance.now() - t0));
    if (resp.error) throw new Error(resp.error.message || 'MCP error');
    const r = resp.result || {};
    if (r.isError) throw new Error((r.content && r.content[0] && r.content[0].text) || 'Tool error');
    // The server wraps dict results as {result: {...}} in structuredContent; unwrap it.
    const sc = r.structuredContent;
    if (sc) return (sc.result && typeof sc.result === 'object' && Object.keys(sc).length === 1) ? sc.result : sc;
    const txt = (r.content || []).find(c => c.type === 'text');
    return txt ? JSON.parse(txt.text) : {};
  }

  // ---- conversation ----
  function addMsg(who, text, node) {
    const m = document.createElement('div');
    m.className = 'msg ' + who;
    if (node) m.append(node);
    if (text) m.append(document.createTextNode(text));
    chat.append(m);
    chat.scrollTop = chat.scrollHeight;
    return m;
  }
  function speak(text) {
    if (!$('speak').checked || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    speechSynthesis.speak(new SpeechSynthesisUtterance(text));
  }
  function say(text) { addMsg('alexa', text); speak(text); }
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  async function withTyping(label, fn) {
    const t = addMsg('alexa typing', label);
    try { return await fn(); } finally { t.remove(); }
  }

  // ---- stand-in intent router (Alexa+ would supply this) ----
  const MEASURE = /\d+(\.\d+)?\s*(cm|centimet|mm|inch|in\b|"|ft|feet|m\b)/i;
  const FILLER = /\b(will|would|does|do|can|could|the|a|an|my|me|it|is|are|fit|fits|under|over|in|on|cabinet|clearance|space|shelf|tall|height|how|risky|risk|return|returned|safe|worth|buying|buy|review|reviews|complain|problem|check|find|search|for|about|tell|whether|should|i|of|to|inches|inch|cm|centimeter|centimeters|feet|\d+(\.\d+)?)\b/g;
  function findProduct(u) {
    let best = null, bestScore = 0;
    for (const p of products) {
      const words = (p.short_title || p.title).toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length > 3);
      const score = words.filter(w => u.includes(w)).length;
      if (score > bestScore) { best = p; bestScore = score; }
    }
    return best;
  }
  async function lookup(u) {
    // Not in the loaded shortlist: catalog search first, then live web research.
    const q = u.replace(FILLER, ' ').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
    if (!q) return null;
    const r = await callTool('search_products', { query: q, limit: 3 });
    let top = (r.products || [])[0];
    if (!top) {
      const w = await withTyping('Not in my catalog. Looking it up online…', () => callTool('research_product', { query: q }));
      if (!w.product) { say(w.spoken); return null; }
      top = w.product;
      say(w.spoken);
    }
    if (!products.some(p => p.asin === top.asin)) products.push(top);
    return top;
  }
  function remember(p) { lastAsin = p.asin; lastTitle = p.short_title || p.title; }

  async function handle(utterance) {
    addMsg('user', utterance);
    const u = utterance.toLowerCase();
    try {
      const generic = /what can you|which products|list|what products|what do you/.test(u);
      let mentioned = findProduct(u);
      if (!mentioned && !generic) mentioned = await lookup(u);
      if (mentioned) remember(mentioned);

      if (generic) { const r = await callTool('list_products'); say(r.spoken); return; }
      const hasSpace = MEASURE.test(u);
      const wantsFit = /fit|under|cabinet|clearance|space|shelf|tall|height/.test(u) || (pendingFit && hasSpace);
      const wantsRisk = /risk|return|safe|worth|review|complain|problem|buy/.test(u);

      if (!lastAsin && (wantsFit || wantsRisk)) {
        say('Which product? Name it, like “the Ninja air fryer” or “a standing desk”.'); return;
      }
      if (wantsFit) {
        // A photo scan stands in for a typed measurement.
        const space = (!hasSpace && scanCm != null) ? `${utterance} ${scanCm} cm` : utterance;
        const r = await callTool('check_fit', { asin: lastAsin, space_description: space });
        pendingFit = r.verdict === 'need_measurement';
        say(r.spoken); return;
      }
      if (wantsRisk) {
        const r = await callTool('analyze_listing', { asin: lastAsin });
        pendingFit = false; say(r.spoken); return;
      }
      say('I can check whether a product will fit your space, or how likely it is to be returned. Try: will the air fryer fit under my 40 centimeter cabinet?');
    } catch (e) {
      say('Sorry, I could not reach ReturnKiller. ' + e.message);
    }
  }

  // ---- photo of the space ----
  async function scanPhoto(file) {
    if (!file) return;
    const img = el('img'); img.alt = 'Your photo'; img.src = URL.createObjectURL(file);
    addMsg('user', '', img);
    const form = new FormData();
    form.append('file', file);
    if (lastAsin) form.append('asin', lastAsin);
    try {
      const data = await withTyping('Looking at your space…', async () => {
        const res = await fetch('/scan', { method: 'POST', body: form });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.detail || 'The scan failed');
        return body;
      });
      if (data.estimated_clearance_height_cm != null) scanCm = data.estimated_clearance_height_cm;
      let text = data.spoken_summary || 'Scan complete.';
      if (data.advice) text += ' ' + data.advice;
      if (!lastAsin) text += ' Tell me which product to check against it.';
      say(text);
    } catch (e) {
      say(e.message + ' Try a clearer, well-lit photo.');
    }
  }
  $('scanBtn').addEventListener('click', () => $('fileScan').click());
  $('uploadBtn').addEventListener('click', () => $('fileUpload').click());
  for (const id of ['fileScan', 'fileUpload']) {
    $(id).addEventListener('change', (ev) => { scanPhoto(ev.target.files[0]); ev.target.value = ''; });
  }

  // The page around this chat tells it which product was analyzed.
  window.addEventListener('message', (ev) => {
    if (ev.origin !== location.origin || !ev.data || ev.data.type !== 'rk-product') return;
    const p = { asin: String(ev.data.asin), title: String(ev.data.title || ''), short_title: String(ev.data.short_title || ev.data.title || '') };
    if (!products.some(x => x.asin === p.asin)) products.push(p);
    remember(p);
    say(`Got it, ${lastTitle}. Ask me if it will fit, or how risky it is.`);
  });

  // ---- wiring ----
  $('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = $('input').value.trim(); if (!v) return;
    $('input').value = ''; handle(v);
  });
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    const rec = new SR(); rec.lang = 'en-US'; rec.interimResults = false;
    rec.onresult = (ev) => handle(ev.results[0][0].transcript);
    rec.onend = () => $('mic').classList.remove('live');
    rec.onerror = () => $('mic').classList.remove('live');
    $('mic').addEventListener('click', () => { speechSynthesis.cancel(); $('mic').classList.add('live'); rec.start(); });
  } else {
    $('mic').disabled = true; $('mic').title = 'Voice input is not supported in this browser';
  }

  async function boot() {
    ['Will the air fryer fit under my 40 cm cabinet?', 'How risky is the cutting board?', 'What can you check?'].forEach(t => {
      const b = el('button', 'chip', t); b.type = 'button'; b.onclick = () => handle(t); $('chips').append(b);
    });
    say('Hi, I\'m Alexa with ReturnKiller. Tell me the product and the space you have, or send a photo of the space, and I\'ll say whether it will fit before you order.');
    try { await ensureInit(); const r = await callTool('list_products'); products = r.products || []; }
    catch (e) { say('I could not connect to the ReturnKiller server. ' + e.message); }
  }
  boot();
})();
</script>
</body>
</html>
